<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Calendario Visual | CN Coslada</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#c0392b", "secondary": "#9ee1df", "background-light": "#f8fafc" },
                    fontFamily: { "display": ["Lexend", "sans-serif"] },
                },
            },
        }
    </script>
    <style> body { font-family: 'Lexend', sans-serif; } </style>
</head>

<body class="bg-background-light text-slate-900 min-h-screen flex flex-col">

    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center gap-4">
                    <img src="logo.jpeg" alt="Logo" class="h-12 w-auto object-contain">
                    <div>
                        <h1 class="text-lg font-extrabold tracking-tight text-slate-900 uppercase leading-none">Club Natación</h1>
                        <h1 class="text-lg font-extrabold tracking-tight text-primary uppercase leading-none">Coslada</h1>
                    </div>
                </div>
                <nav class="hidden md:flex items-center gap-8">
                    <a class="text-sm font-bold text-slate-600 hover:text-primary transition-colors" href="index.html">Inicio</a>
                    <a class="text-sm font-bold text-primary transition-colors" href="competiciones.html">Competiciones</a> <a class="text-sm font-bold text-slate-600 hover:text-primary transition-colors" href="historia.html">El Club</a>
                    <a class="text-sm font-bold text-slate-600 hover:text-primary transition-colors" href="contacto.html">Contacto</a>
                </nav>
                <div class="flex items-center gap-4">
                    <a href="inscripcion.html" class="bg-primary text-white px-5 py-2 rounded-lg text-sm font-bold hover:bg-red-700 transition-all shadow-lg shadow-red-500/30">¡Inscríbete!</a>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        
        <div class="flex justify-between items-end mb-8">
            <div>
                <span class="text-primary font-bold text-sm tracking-widest uppercase">Temporada 2026</span>
                <h2 class="text-4xl font-black text-slate-900">Enero 2026</h2>
            </div>
            <div class="flex gap-4 text-sm font-medium">
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-primary"></span> Casa</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-slate-400"></span> Fuera</div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
            
            <div class="grid grid-cols-7 bg-slate-50 border-b border-slate-200">
                <div class="py-3 text-center text-xs font-bold text-slate-500 uppercase">Lun</div>
                <div class="py-3 text-center text-xs font-bold text-slate-500 uppercase">Mar</div>
                <div class="py-3 text-center text-xs font-bold text-slate-500 uppercase">Mié</div>
                <div class="py-3 text-center text-xs font-bold text-slate-500 uppercase">Jue</div>
                <div class="py-3 text-center text-xs font-bold text-slate-500 uppercase">Vie</div>
                <div class="py-3 text-center text-xs font-bold text-slate-500 uppercase">Sáb</div>
                <div class="py-3 text-center text-xs font-bold text-slate-500 uppercase">Dom</div>
            </div>

            <div id="grid-calendario" class="grid grid-cols-7 auto-rows-fr">
                </div>
        </div>

        <div class="mt-8 text-center">
             <a href="competiciones.html" class="text-primary font-bold hover:underline flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">list</span> Ver vista de lista detallada
             </a>
        </div>

    </main>

    <footer class="bg-white border-t border-slate-200 pt-12 pb-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p class="text-xs text-slate-400">© 2026 Club Natación Coslada.</p>
        </div>
    </footer>

    <script>
        // 1. DATOS DE LAS COMPETICIONES
        const eventos = [
            { dia: 10, titulo: "Liga Madrid (Jun)", tipo: "fuera" },
            { dia: 11, titulo: "Liga Madrid (Jun)", tipo: "fuera" },
            { dia: 17, titulo: "Liga Infantil", tipo: "fuera" },
            { dia: 18, titulo: "Liga Infantil", tipo: "fuera" },
            { dia: 24, titulo: "LIGA BENJAMÍN (CASA)", tipo: "casa" }, // ESTA ES LA IMPORTANTE
            { dia: 25, titulo: "Cto. Alevín", tipo: "fuera" },
            { dia: 30, titulo: "Open Absoluto", tipo: "fuera" },
            { dia: 31, titulo: "Open Absoluto", tipo: "fuera" }
        ];

        // 2. CONFIGURACIÓN DE ENERO 2026
        const diasEnMes = 31;
        const primerDiaSemana = 3; // El 1 de Enero de 2026 cae en Jueves (0=Dom, 1=Lun, 2=Mar, 3=Mié, 4=Jue...) 
        // Nota: En JS getDay() domingo es 0. Ajustamos para que Lunes sea el primero visualmente.
        // Jueves es el 4º hueco si empezamos en Lunes.
        const huecosVacios = 3; 

        const grid = document.getElementById('grid-calendario');

        // 3. GENERAR HUECOS VACÍOS (Días del mes anterior)
        for (let i = 0; i < huecosVacios; i++) {
            const hueco = document.createElement('div');
            hueco.className = "bg-slate-50/50 border-r border-b border-slate-100 min-h-[100px]"; // Gris y vacío
            grid.appendChild(hueco);
        }

        // 4. GENERAR LOS DÍAS REALES
        for (let dia = 1; dia <= diasEnMes; dia++) {
            const celda = document.createElement('div');
            celda.className = "border-r border-b border-slate-100 p-2 min-h-[120px] relative hover:bg-slate-50 transition-colors group";
            
            // Número del día
            const numero = document.createElement('span');
            numero.className = "text-sm font-bold text-slate-400 group-hover:text-slate-900";
            numero.innerText = dia;
            celda.appendChild(numero);

            // BUSCAR SI HAY EVENTO HOY
            const eventoHoy = eventos.find(e => e.dia === dia);

            if (eventoHoy) {
                const etiqueta = document.createElement('div');
                
                // Estilo según si es CASA o FUERA
                if (eventoHoy.tipo === 'casa') {
                    etiqueta.className = "mt-2 bg-primary text-white text-[10px] font-bold p-1.5 rounded shadow-sm leading-tight";
                } else {
                    etiqueta.className = "mt-2 bg-slate-100 text-slate-600 border border-slate-200 text-[10px] font-bold p-1.5 rounded leading-tight";
                }
                
                etiqueta.innerText = eventoHoy.titulo;
                celda.appendChild(etiqueta);
            }

            grid.appendChild(celda);
        }
    </script>

</body>
</html>
